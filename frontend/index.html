<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elevation Compare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header__brand">
      <svg class="header__logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="3,17 8,10 13,14 18,7 21,9" />
      </svg>
      <span class="header__title">Elevation Compare</span>
    </div>
    <div class="header__controls">
      <div class="unit-toggles" role="group" aria-label="Unit settings">
        <button class="toggle-btn" id="distanceToggle" aria-label="Switch to km">miles</button>
        <button class="toggle-btn" id="elevationToggle" aria-label="Switch to m">ft</button>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="Switch to dark mode">
        <svg id="sunIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="moonIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Route management">
      <div class="upload-zone" id="uploadZone" role="button" tabindex="0" aria-label="Upload GPX files — click or drag and drop">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span class="upload-zone__text">Drop .gpx files here</span>
        <span class="upload-zone__sub">or click to browse</span>
        <input type="file" id="fileInput" accept=".gpx" multiple aria-hidden="true" tabindex="-1" />
      </div>

      <div class="sidebar__section">
        <div class="sidebar__section-header">
          <span>Routes</span>
          <span id="routeCount" class="badge">0</span>
        </div>
        <ul class="route-list" id="routeList" aria-label="Uploaded routes" role="list">
          <li class="route-list__empty" id="emptyState">No routes uploaded yet</li>
        </ul>
      </div>
    </aside>

    <main class="main" aria-label="Elevation profile chart">
      <div class="chart-wrapper">
        <div class="chart-empty" id="chartEmpty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3,17 8,10 13,14 18,7 21,9"/>
          </svg>
          <p>Upload a .gpx file to compare elevation profiles</p>
        </div>
        <div class="chart-canvas-container" id="chartCanvasContainer">
          <canvas id="elevationChart" aria-label="Elevation profile comparison chart" role="img"></canvas>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
